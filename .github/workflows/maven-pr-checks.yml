name: Java Compile and Test

on: 
  pull_request:
    branches: 
      - master
jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v1
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 17
    - name: Build with Maven
      run: mvn test --file pom.xml
